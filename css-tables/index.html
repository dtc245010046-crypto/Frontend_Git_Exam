<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng trong CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Bảng danh sách học viên</h1>
        <p>Bảng này minh họa cách định dạng đường viền, kích thước, căn chỉnh, khoảng cách và màu sắc bằng CSS.</p>

        <table>
            <thead>
                <tr>
                    <th scope="col">Họ và tên</th>
                    <th scope="col">Tuổi</th>
                    <th scope="col">Lớp</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Nguyễn Văn A</td>
                    <td>20</td>
                    <td>Web</td>
                </tr>
                <tr>
                    <td>Trần Thị B</td>
                    <td>21</td>
                    <td>Web</td>
                </tr>
                <tr>
                    <td>Lê Minh C</td>
                    <td>19</td>
                    <td>Web nâng cao</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
