<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
    <style>
        body {
            max-width: 820px;
            margin: 40px auto;
            padding: 0 16px;
            color: #263449;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #2457a6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 14px;
            border: 1px solid #b9c7d8;
            text-align: left;
        }

        thead {
            background: #eaf1fb;
        }
    </style>
</head>
<body>
    <h1>Lịch họp công ty</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Ngày</th>
                <th colspan="2" scope="colgroup">Giờ</th>
                <th rowspan="2" scope="col">Nội dung cuộc họp</th>
            </tr>
            <tr>
                <th scope="col">Bắt đầu</th>
                <th scope="col">Kết thúc</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Thứ Hai</td>
                <td>09:00</td>
                <td>10:00</td>
                <td>Họp kế hoạch tuần</td>
            </tr>
            <tr>
                <td>14:00</td>
                <td>15:00</td>
                <td>Đánh giá tiến độ dự án</td>
            </tr>
            <tr>
                <td>Thứ Ba</td>
                <td colspan="2">09:00–11:00</td>
                <td>Họp chiến lược (kéo dài 2 giờ)</td>
            </tr>
            <tr>
                <td>Thứ Tư</td>
                <td>10:00</td>
                <td>11:00</td>
                <td>Trao đổi công việc nhóm</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
