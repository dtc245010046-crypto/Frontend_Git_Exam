<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 16px;
            color: #263449;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #2457a6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            text-align: left;
        }

        th {
            background: #eaf1fb;
        }

        td:nth-child(2),
        td:nth-child(3) {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>
    <table>
        <thead>
            <tr>
                <th scope="col">Tên sản phẩm</th>
                <th scope="col">Giá</th>
                <th scope="col">Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Bình nước</td>
                <td>120.000 ₫</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Balo</td>
                <td>450.000 ₫</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Tai nghe</td>
                <td>320.000 ₫</td>
                <td>18</td>
            </tr>
            <tr>
                <td>Sổ tay</td>
                <td>55.000 ₫</td>
                <td>40</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
