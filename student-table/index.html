<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bảng đơn giản trong HTML</title>
    </head>
    <body>
        <h1>Danh sách học sinh</h1>
        <table border="1">
            <thead>
                <tr>
                    <th scope="col">Họ và Tên</th>
                    <th scope="col">Tuổi</th>
                    <th scope="col">Lớp</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Nguyễn Văn A</td>
                    <td>15</td>
                    <td>10A1</td>
                </tr>
                <tr>
                    <td>Trần Thị B</td>
                    <td>16</td>
                    <td>11B2</td>
                </tr>
                <tr>
                    <td>Lê Văn C</td>
                    <td>17</td>
                    <td>12C3</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
