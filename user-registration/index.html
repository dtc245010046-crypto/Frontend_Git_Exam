<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký người dùng</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 16px;
            display: grid;
            place-items: center;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        .registration-card {
            width: min(100%, 460px);
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 12px 32px rgb(15 23 42 / 10%);
        }

        h1 {
            margin: 0 0 8px;
            color: #1d4ed8;
            font-size: 26px;
            text-align: center;
        }

        .intro {
            margin: 0 0 24px;
            color: #64748b;
            text-align: center;
        }

        .field {
            margin-bottom: 18px;
        }

        .field > label,
        legend {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        input:focus {
            border-color: #2563eb;
            outline: 3px solid rgb(37 99 235 / 15%);
        }

        fieldset {
            margin: 0 0 22px;
            padding: 0;
            border: 0;
        }

        legend {
            padding: 0;
        }

        .gender-options {
            display: flex;
            gap: 22px;
        }

        .gender-options label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <main class="registration-card">
        <h1>Đăng ký người dùng</h1>
        <p class="intro">Vui lòng điền thông tin của bạn</p>

        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            <div class="field">
                <label for="name">Họ và tên</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" required>
            </div>

            <fieldset>
                <legend>Giới tính</legend>
                <div class="gender-options">
                    <label><input type="radio" name="gender" value="male" required> Nam</label>
                    <label><input type="radio" name="gender" value="female"> Nữ</label>
                </div>
            </fieldset>

            <button type="submit">Đăng ký</button>
        </form>
    </main>
</body>
</html>
